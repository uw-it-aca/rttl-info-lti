name: rttl-info-ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  GAR_LOCATION: us-west1

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version number
        run: |
          if [ ! -f rttlinfo/VERSION ]; then
            echo "ERROR: VERSION file not found"
            exit 1
          fi
          VER=$(cat rttlinfo/VERSION)
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "Building version: $VER"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          target: app-container
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: rttlinfo-lti:scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          image-ref: 'rttlinfo-lti:scan'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_RTTL_AR_WRITER_KEY }}

      - name: Configure Docker for GAR
        if: github.event_name == 'push'
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Push image to GAR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: app-container
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            us-west1-docker.pkg.dev/uwit-mci-axdd/rttl-images/rttlinfo-lti:${{ env.VERSION }}
            us-west1-docker.pkg.dev/uwit-mci-axdd/rttl-images/rttlinfo-lti:latest
