name: rttl-info-ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  GAR_LOCATION: us-west1

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version number
        id: version
        run: |
          if [ ! -f rttlinfo/VERSION ]; then
            echo "ERROR: VERSION file not found"
            exit 1
          fi
          VER=$(cat rttlinfo/VERSION)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Building version: $VER"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          target: app-container
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            rttlinfo-lti:scan
            rttlinfo-lti:${{ steps.version.outputs.version }}

      - name: Run vulnerability scan
        id: vuln-scan
        uses: uw-it-aca/actions/container-vuln-scan@task/update_trivy_v035
        with:
          image_tag: rttlinfo-lti:scan
          severity: 'CRITICAL'
          upload_results: 'false'

      - name: Summarize scan findings
        if: always()
        run: |
          RESULTS_FILE='${{ steps.vuln-scan.outputs.results_file }}'
          if [[ -z "$RESULTS_FILE" || ! -f "$RESULTS_FILE" ]]; then
            echo "No Trivy results file found at '$RESULTS_FILE'."
            exit 0
          fi

          echo "## Trivy scan findings" >> "$GITHUB_STEP_SUMMARY"
          echo "Results file: $RESULTS_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            .runs[] as $run
            | ($run.tool.driver.rules // []
              | map({key: .id, value: (.properties."security-severity" // "n/a")})
              | from_entries) as $sev_by_rule
            | $run.results[]?
            | [
                (.ruleId // "unknown"),
                ($sev_by_rule[.ruleId] // "n/a"),
                ((.message.text // .message.markdown // "no message") | gsub("[\r\n]"; " "))
              ]
            | @tsv
          ' "$RESULTS_FILE" > trivy-findings.tsv

          {
            echo "rule_id\tsecurity_severity\tmessage"
            cat trivy-findings.tsv
          } > trivy-findings-with-header.tsv

          {
            echo '```text'
            head -n 200 trivy-findings-with-header.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-${{ github.run_id }}
          path: |
            ${{ steps.vuln-scan.outputs.results_file }}
            trivy-findings.tsv
            trivy-findings-with-header.tsv
          if-no-files-found: warn

      - name: Block push on vulnerabilities
        if: steps.vuln-scan.outputs.vulnerabilities_found == 'true'
        run: |
          echo "CRITICAL vulnerabilities were found. Blocking image push."
          exit 1

      - name: Push Image to Repository
        if: github.event_name == 'push'
        uses: uw-it-aca/actions/gcr-push-workload-identity@main
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          add_latest_tag: 'true'
          image_tag: 'rttlinfo-lti:${{ steps.version.outputs.version }}'
          registry_hostname: 'us-west1-docker.pkg.dev'
          registry_project_id: 'uwit-mci-axdd'
          registry_path: 'rttl-images'
