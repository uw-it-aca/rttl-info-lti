name: rttl-info-ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  # Release name used for the flux manifest and branch names
  RELEASE_NAME: rttlinfo-lti
  # Image repository name within the artifact registry
  IMAGE_NAME: rttlinfo-lti
  GAR_LOCATION: us-west1
  REGISTRY_HOSTNAME: us-west1-docker.pkg.dev
  REGISTRY_PROJECT_ID: uwit-mci-axdd
  REGISTRY_PATH: rttl-images

jobs:
  context:
    runs-on: ubuntu-24.04 

    outputs:
      commit_hash: ${{ steps.context.outputs.commit_hash }}
      git_repo_branch: ${{ steps.context.outputs.git_repo_branch }}

    steps:
      - name: Set up Context
        id: context
        uses: uw-it-aca/actions/cicd-context@main
        with:
          release_name: ${{ env.RELEASE_NAME }}

  docker:
    runs-on: ubuntu-24.04 
    needs: context
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get version number
        id: version
        env:
          GIT_REPO_BRANCH: ${{ needs.context.outputs.git_repo_branch }}
        run: |
          if [ ! -f rttlinfo/VERSION ]; then
            echo "ERROR: VERSION file not found"
            exit 1
          fi
          VER=$(cat rttlinfo/VERSION)
          # keep non-main (eval) builds from sharing a version tag with prod
          if [ "$GIT_REPO_BRANCH" != "main" ]; then
            VER="${VER}-dev"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Building version: $VER"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          target: app-container
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:scan
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ needs.context.outputs.commit_hash }}

      - name: Verify production image
        run: |
          docker run --rm --entrypoint /app/bin/python \
            "${{ env.IMAGE_NAME }}:scan" -c '
          import importlib.util
          import django
          assert importlib.util.find_spec("pip") is None, "pip must not ship in production"
          '

      - name: Run vulnerability scan
        id: vuln-scan
        uses: uw-it-aca/actions/container-vuln-scan@main
        with:
          image_tag: ${{ env.IMAGE_NAME }}:scan
          severity: 'CRITICAL'
          upload_results: 'false'

      - name: Block push on vulnerabilities
        if: steps.vuln-scan.outputs.vulnerabilities_found == 'true'
        run: |
          echo "CRITICAL vulnerabilities were found. Blocking image push."
          exit 1

      - name: Push Image to Repository
        if: github.event_name == 'push'
        uses: uw-it-aca/actions/gcr-push-workload-identity@main
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          # only main publishes latest
          add_latest_tag: ${{ needs.context.outputs.git_repo_branch == 'main' && 'true' || 'false' }}
          image_tag: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          registry_hostname: ${{ env.REGISTRY_HOSTNAME }}
          registry_project_id: ${{ env.REGISTRY_PROJECT_ID }}
          registry_path: ${{ env.REGISTRY_PATH }}

      # The commit hash tag is what the flux manifest deploys
      - name: Push Commit Tagged Image to Repository
        if: github.event_name == 'push'
        uses: uw-it-aca/actions/gcr-push-workload-identity@main
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          image_tag: ${{ env.IMAGE_NAME }}:${{ needs.context.outputs.commit_hash }}
          registry_hostname: ${{ env.REGISTRY_HOSTNAME }}
          registry_project_id: ${{ env.REGISTRY_PROJECT_ID }}
          registry_path: ${{ env.REGISTRY_PATH }}

  deploy:
    # develop: manifest PR to gcp-flux-rttl-eval (deploy/), merged automatically
    # main:    manifest PR to gcp-flux-rttl-prod (prod/), merged manually
    if: github.event_name == 'push'

    needs: [context, docker]

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Deploy to Eval
        if: needs.context.outputs.git_repo_branch == 'develop'
        uses: uw-it-aca/actions/cicd-deploy@main
        with:
          release_name: ${{ env.RELEASE_NAME }}
          commit_hash: ${{ needs.context.outputs.commit_hash }}
          git_repo_branch: ${{ needs.context.outputs.git_repo_branch }}
          gh_auth_token: ${{ secrets.GH_AUTH_TOKEN }}
          registry_name: ${{ env.REGISTRY_HOSTNAME }}/${{ env.REGISTRY_PROJECT_ID }}/${{ env.REGISTRY_PATH }}/${{ env.IMAGE_NAME }}
          flux_repo_base: gcp-flux-rttl-
          flux_repo_default_branch: main
          gcp_development_flux_instance: eval
          flux_manifest_dir: deploy

      - name: Deploy to Prod
        if: needs.context.outputs.git_repo_branch == 'main'
        uses: uw-it-aca/actions/cicd-deploy@main
        with:
          release_name: ${{ env.RELEASE_NAME }}
          commit_hash: ${{ needs.context.outputs.commit_hash }}
          git_repo_branch: ${{ needs.context.outputs.git_repo_branch }}
          gh_auth_token: ${{ secrets.GH_AUTH_TOKEN }}
          registry_name: ${{ env.REGISTRY_HOSTNAME }}/${{ env.REGISTRY_PROJECT_ID }}/${{ env.REGISTRY_PATH }}/${{ env.IMAGE_NAME }}
          flux_repo_base: gcp-flux-rttl-
          flux_repo_default_branch: main
          gcp_production_flux_instance: prod
          flux_manifest_dir: prod
