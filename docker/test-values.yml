gateway:
  enabled: true
  hostnames:
    - jupyter.eval.rttl.uw.edu
  paths:
    - /rttlinfo/
  listenerSet:
    name: jupyter-eval
    namespace: default
    httpSection: jupyter-eval-http
    httpsSection: jupyter-eval-https
namespace:
  enabled: true
  name: rttlinfo-lti
repo: rttlinfo-lti
instance: test
replicaCount: 1
affinity:
  podsSpanNodes: true
lifecycle:
  enabled: true
  preStop:
    enabled: true
readiness:
  enabled: true
database:
  engine: null
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 25m
    memory: 256Mi
autoscaling:
  enabled: false
memcached:
  enabled: true
  replicaCount: 1
  updateStrategy:
    type: RollingUpdate
configmaps:
  lti-tool-config:
    tool.json: |
      {
        "https://canvas.test.instructure.com": [{
          "default": true,
          "client_id": "100000000000864",
          "auth_login_url": "https://sso.test.canvaslms.com/api/lti/authorize_redirect",
          "auth_token_url": "https://sso.test.canvaslms.com/login/oauth2/token",
          "key_set_url": "https://sso.test.canvaslms.com/api/lti/security/jwks",
          "key_set": null,
          "private_key_file": "/lti/keys/private-key-1.key",
          "public_key_file": "/lti/keys/public-key-1.key",
          "deployment_ids": ["215319:c78d46b24c785a8ad37b5bf9bdf26ceb32cc9d18"]
        }]
      }
mountedSecrets:
  enabled: true
  secretName: rttlinfo-lti.rttl.uw.edu-lti-keys
  mountPath: /lti/keys
podVolumes:
  lti-tool-config:
    volume:
      configMap:
        name: lti-tool-config
    mount:
      mountPath: /lti/config
environmentVariables:
  - name: DEBUG_LOGGING
    value: "True"
  - name: RESTCLIENTS_SWS_DAO_CLASS
    value: "Live"
  - name: RESTCLIENTS_SWS_HOST
    value: "https://ws.api.uw.edu"
  - name: CLUSTER_CNAME
    value: jupyter.eval.rttl.uw.edu
  - name: AUTH
    value: BLTI
  - name: ENV
    value: test
  - name: SESSION_BACKEND
    value: MEMCACHED
  - name: LTI_CONFIG_DIRECTORY
    value: /lti/config
externalSecrets:
  enabled: true
  secrets:
    - name: rttlinfo-lti.rttl.uw.edu-secrets
      externalKey: rttl/eval/lti/secrets
      data:
        - name: django-secret
          property: django-secret
        - name: lti-consumers
          property: lti-consumers
        - name: blti-aes-key
          property: blti-aes-key
        - name: blti-aes-iv
          property: blti-aes-iv
        - name: rttl-api-key
          property: rttl-api-key
        - name: rttl-base-url
          property: rttl-base-url
        - name: sws-access-token
          property: sws-access-token
    - name: rttlinfo-lti.rttl.uw.edu-lti-keys
      externalKey: rttl/eval/lti/lti-keys
      data:
        - name: private-key-1.key
          property: private-key-1.key
        - name: public-key-1.key
          property: public-key-1.key
environmentVariablesSecrets:
  django-secret:
    name: DJANGO_SECRET
    secretName: rttlinfo-lti.rttl.uw.edu-secrets
    secretKey: django-secret
  BLTIAESIV:
    name: BLTI_AES_IV
    secretName: rttlinfo-lti.rttl.uw.edu-secrets
    secretKey: blti-aes-iv
  BLTIAESKey:
    name: BLTI_AES_KEY
    secretName: rttlinfo-lti.rttl.uw.edu-secrets
    secretKey: blti-aes-key
  LTIConsumers:
    name: LTI_CONSUMERS
    secretName: rttlinfo-lti.rttl.uw.edu-secrets
    secretKey: lti-consumers
  rttlAPIKey:
    name: RTTL_API_KEY
    secretName: rttlinfo-lti.rttl.uw.edu-secrets
    secretKey: rttl-api-key
  rttlBaseURL:
    name: RTTL_BASE_URL
    secretName: rttlinfo-lti.rttl.uw.edu-secrets
    secretKey: rttl-base-url
  swsToken:
    name: RESTCLIENTS_SWS_OAUTH_BEARER
    secretName: rttlinfo-lti.rttl.uw.edu-secrets
    secretKey: sws-access-token
